<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="AI Ride connects people already travelling a route with passengers heading the same way. Two portals: rider and passenger, one live map.">
  <meta name="color-scheme" content="dark light">

  <!-- Backend location. Leave blank for local development (falls back to
       http://127.0.0.1:8000). After deploying the API to Render, put its URL
       here, e.g. content="https://airide-api.onrender.com" -->
  <meta name="airide-api" content="">
  <title>AI Ride — shared rides on the route you already take</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="favicon.ico">

  <!-- Type is the iOS system face (SF Pro). Inter loads only as the fallback
       for devices that do not ship SF Pro. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/video/hero-poster.jpg">

  <link rel="stylesheet" href="assets/lib/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="visually-hidden" href="#outlet">Skip to main content</a>
  <div id="app"></div>

  <noscript>
    <div class="container page">
      <h1>JavaScript is required</h1>
      <p>AI Ride needs JavaScript for the live map and ride matching. Please enable it and reload.</p>
    </div>
  </noscript>

  <script src="assets/lib/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>

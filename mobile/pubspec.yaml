name: airide_mobile
description: "AI RIDE - Intelligent Route Overlap and Trust-Based Matching System for AI-driven Decentralised Cost-Sharing Mobility"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking & Real-Time Communication
  http: ^1.2.0
  web_socket_channel: ^2.4.1
  
  # State Management & DI
  provider: ^6.1.1
  
  # Secure Storage & Persistence
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Location, Geocoding & OpenStreetMap
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0

  # Utilities & UI Helpers
  intl: ^0.19.0
  flutter_spinkit: ^5.2.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

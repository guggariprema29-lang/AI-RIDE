# Render blueprint — free tier.
# Deploy with: Render dashboard → New → Blueprint → point at this repo.
#
# Note on the free plan: the web service sleeps after ~15 minutes idle and takes
# roughly 50 seconds to wake, and the free Postgres instance expires after 30
# days. Fine for a demo; plan around it before a live viva.

services:
  - type: web
    name: airide-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r ../requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: airide-db
          property: connectionString
      # Set this to your Vercel URL after the first frontend deploy,
      # e.g. https://ai-ride.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
      # Optional — leave blank to keep OTP in demo mode.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false

databases:
  - name: airide-db
    plan: free
    region: singapore
    databaseName: ride_sharing_db
    user: airide
